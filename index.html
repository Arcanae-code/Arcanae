<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcanae</title>
<meta name="description" content="Arcanae — structure Esport Overwatch. Lunaris, Solaris, Stellaris, Tempest.">
<meta property="og:title" content="Arcanae">
<meta property="og:description" content="Structure Esport Overwatch. Quatre équipes, quatre couleurs, un même papillon.">
<meta property="og:image" content="logo-arcanae.png">
<link rel="icon" href="logo-arcanae.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#120E1C; --ink-2:#1A1527;
  --hair:rgba(198,186,224,.16); --hair-2:rgba(198,186,224,.34);
  --text:#EBE6F4; --dim:#9E96B4; --faint:#6E6783;
  --plaque:#EDEFF6;
  --serif:"EB Garamond",Georgia,serif;
  --sans:"Archivo",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html:focus-within{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--serif);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(110% 70% at 50% -12%,rgba(123,94,214,.22),transparent 62%),
             radial-gradient(70% 50% at 88% 14%,rgba(243,197,68,.06),transparent 66%),
             radial-gradient(80% 55% at 6% 34%,rgba(232,82,82,.06),transparent 66%)}
.wrap{position:relative;z-index:1}
.page{max-width:1080px;margin:0 auto;padding:0 28px}
a{color:inherit}
:focus-visible{outline:2px solid #F3C544;outline-offset:3px;border-radius:2px}
img{max-width:100%;display:block}

.bar{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:20px 0 16px;border-bottom:1px solid var(--hair)}
.mark{font-size:20px;font-weight:600;letter-spacing:.3em;text-decoration:none;white-space:nowrap}
.bar nav{display:flex;gap:20px;flex-wrap:wrap;font-family:var(--sans);font-size:13px;letter-spacing:.03em}
.bar nav a{color:var(--dim);text-decoration:none;display:flex;align-items:center;gap:7px;padding-bottom:2px;border-bottom:1px solid transparent}
.bar nav a:hover,.bar nav a[aria-current="page"]{color:var(--text);border-bottom-color:var(--hair-2)}
.dot{width:7px;height:7px;flex:0 0 7px;background:currentColor}
.editbtn{font-family:var(--sans);font-size:12px;letter-spacing:.06em;background:none;color:var(--faint);border:1px solid var(--hair);padding:6px 12px;cursor:pointer}
.editbtn:hover{color:var(--text);border-color:var(--hair-2)}
.editbtn.on{color:var(--ink);background:#F3C544;border-color:#F3C544}

.hero{padding:46px 0 58px;text-align:center}
.hero .logo{width:min(280px,60vw);margin:0 auto}
.hero h1{font-size:clamp(54px,10vw,104px);font-weight:500;line-height:.95;letter-spacing:.02em;margin:24px 0 0}
.hero .sub{margin:12px auto 0;max-width:44ch;color:var(--dim);font-size:19px}
.spectrum{display:flex;max-width:360px;margin:28px auto 0}
.spectrum i{height:3px;flex:1}
.staff{margin:38px auto 0;max-width:340px;border-top:1px solid var(--hair)}
.staff .row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-bottom:1px solid var(--hair)}
.staff .who{font-size:24px}
.staff .what{font-family:var(--sans);font-size:11.5px;letter-spacing:.14em;color:var(--faint);white-space:nowrap}

.section{padding:58px 0;border-top:1px solid var(--hair)}
.section > .head{display:flex;align-items:baseline;justify-content:space-between;gap:28px;flex-wrap:wrap;margin-bottom:28px}
.section h2{font-size:clamp(28px,4.2vw,40px);font-weight:500;margin:0}
.section .head p{margin:0;max-width:42ch;color:var(--dim);font-size:16.5px}

.index{border-top:1px solid var(--hair)}
.trow{display:flex;align-items:center;gap:20px;padding:18px 4px 18px 22px;border-bottom:1px solid var(--hair);text-decoration:none;position:relative}
.trow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.85}
.trow .thumb{height:58px;flex:0 0 auto;display:block;line-height:0}
.trow .thumb.light{background:var(--plaque);border-color:rgba(0,0,0,.1)}
.trow .thumb img{height:58px;width:auto;display:block}
.trow .thumb.empty{width:58px;height:58px;display:grid;place-items:center;border:1px dashed var(--hair);background:rgba(0,0,0,.2);background:rgba(0,0,0,.2);font-family:var(--sans);font-size:9.5px;letter-spacing:.05em;color:var(--faint);text-align:center;line-height:1.3}
.trow .nm{flex:1 1 auto;min-width:0}
.trow .genus{font-size:15px;color:var(--dim);letter-spacing:.14em;display:block;line-height:1.2}
.trow .species{font-style:italic;font-weight:600;font-size:clamp(28px,4.4vw,38px);line-height:1.05;color:var(--accent);display:block}
.trow .count{font-family:var(--sans);font-size:12.5px;letter-spacing:.05em;color:var(--faint);white-space:nowrap}
.trow:hover .count{color:var(--dim)}
.trow:hover{background:linear-gradient(90deg,rgba(255,255,255,.035),transparent 70%)}

.theader{display:flex;gap:28px;align-items:flex-start;padding:44px 0 32px;flex-wrap:wrap}
.crest{height:176px;flex:0 0 auto;display:block;line-height:0}
.crest.light{background:var(--plaque);border-color:rgba(0,0,0,.14)}
.crest img{height:176px;width:auto;display:block}
.crest.empty{width:176px;height:176px;display:grid;place-items:center;border:1px dashed var(--hair);background:rgba(0,0,0,.22);font-family:var(--sans);font-size:11px;letter-spacing:.05em;color:var(--faint);text-align:center;line-height:1.4;padding:0 10px}
.theader .naming{flex:1 1 260px;min-width:0}
.theader .genus{font-size:19px;color:var(--dim);letter-spacing:.16em;margin:0}
.theader .species{font-style:italic;font-weight:600;font-size:clamp(44px,8vw,76px);line-height:.98;color:var(--accent);margin:2px 0 0}
.theader .swatch{margin:12px 0 0;display:flex;align-items:center;gap:10px;font-family:var(--sans);font-size:12px;letter-spacing:.07em;color:var(--faint)}
.theader .swatch i{width:40px;height:10px;background:var(--accent);display:block}
.back{font-family:var(--sans);font-size:12.5px;letter-spacing:.06em;color:var(--faint);text-decoration:none;display:inline-block;margin:24px 0 0}
.back:hover{color:var(--text)}

.roster{border-top:1px solid var(--hair-2);margin-top:8px}
.prow{display:grid;grid-template-columns:26px 124px 1fr 1.3fr;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid var(--hair)}
.prow .glyph{color:var(--accent);display:block}
.prow .glyph svg{width:22px;height:22px;display:block}
.prow .role{font-family:var(--sans);font-size:11px;letter-spacing:.11em;color:var(--faint)}
.prow .pseudo{font-size:25px;line-height:1.15;word-break:break-word}
.prow .cap{font-family:var(--sans);font-size:9.5px;letter-spacing:.12em;color:var(--accent);border:1px solid var(--accent);padding:2px 6px;margin-left:9px;vertical-align:middle;white-space:nowrap}
.prow .heroes{color:var(--dim);font-size:17px}
.prow .heroes em{font-style:normal;color:var(--faint)}
.empty-note{padding:26px 0;color:var(--faint);font-size:17px;border-bottom:1px solid var(--hair)}
a.prow{text-decoration:none;color:inherit}
a.prow:hover{background:linear-gradient(90deg,rgba(255,255,255,.045),transparent 72%)}
a.prow:hover .pseudo{color:var(--accent)}
.block-title{font-family:var(--sans);font-size:11.5px;letter-spacing:.14em;color:var(--faint);margin:40px 0 10px;font-weight:600}
.pcard{display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap;padding:40px 0 6px}
.pmain{flex:0 0 auto;width:min(270px,54vw)}
.pmain img{width:100%;height:auto;display:block}
.pmain .none{border:1px dashed var(--hair);min-height:200px;display:grid;place-items:center;font-family:var(--sans);font-size:11px;letter-spacing:.06em;color:var(--faint);text-align:center;padding:0 14px;line-height:1.5}
.pinfo{flex:1 1 300px;min-width:0}
.prole{display:flex;align-items:center;gap:11px;font-family:var(--sans);font-size:11.5px;letter-spacing:.12em;color:var(--faint);margin:0}
.prole .glyph{color:var(--accent)}
.prole .glyph svg{width:20px;height:20px;display:block}
.pinfo h2{font-size:clamp(40px,7vw,66px);font-weight:500;margin:7px 0 0;line-height:1;word-break:break-word}
.plist{margin:18px 0 0;color:var(--dim);font-size:18px}
.plist em{font-style:normal;color:var(--faint)}
.psoc{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 0}
.psoc a{display:flex;align-items:center;gap:9px;border:1px solid var(--hair);padding:9px 14px;text-decoration:none;font-family:var(--sans);font-size:13px;color:var(--dim)}
.psoc a svg{width:17px;height:17px;flex:0 0 17px;fill:var(--dim)}
.psoc a:hover{border-color:var(--accent);color:var(--text)}
.psoc a:hover svg{fill:var(--accent)}

.draft{margin:0 0 22px;padding:14px 18px;background:rgba(243,197,68,.09);border-left:3px solid #F3C544;font-family:var(--sans);font-size:13px;color:var(--dim);line-height:1.6}
.draft b{color:var(--text);font-weight:600}
.draft .acts{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}
.editbar{margin:0 0 18px;padding:12px 16px;background:rgba(243,197,68,.08);border-left:3px solid #F3C544;font-family:var(--sans);font-size:13px;color:var(--dim)}
.esec{margin:30px 0 0;padding:20px;border:1px solid var(--hair);background:rgba(0,0,0,.16)}
.esec h3{font-family:var(--sans);font-size:12px;letter-spacing:.14em;color:var(--faint);margin:0 0 14px;font-weight:600}
.erow{display:grid;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid var(--hair)}
.erow.player{grid-template-columns:128px 1fr 48px 1.2fr 116px 34px}
.erow.staff{grid-template-columns:1fr 1fr 34px}
.erow.link{grid-template-columns:130px 1fr 1.4fr 34px}
.erow.team{grid-template-columns:1fr 54px 1fr 34px 34px 34px}
input,select{font-family:var(--sans);font-size:14px;background:var(--ink-2);color:var(--text);border:1px solid var(--hair);padding:8px 10px;width:100%;min-width:0;border-radius:0}
input::placeholder{color:var(--faint)}
input:focus,select:focus{border-color:var(--hair-2);outline:none}
select{cursor:pointer}
input[type=color]{padding:3px;height:36px;cursor:pointer}
.chk{display:grid;place-items:center}
.chk input{width:17px;height:17px;accent-color:#F3C544;cursor:pointer}
.iconbtn{font-family:var(--sans);font-size:12px;background:none;border:1px solid var(--hair);color:var(--faint);padding:8px 0;cursor:pointer;width:100%}
.iconbtn:hover{color:#E85252;border-color:#E85252}
.iconbtn.armed{color:var(--ink);background:#E85252;border-color:#E85252}
.iconbtn.move:hover{color:var(--text);border-color:var(--text)}
.btn{font-family:var(--sans);font-size:13px;letter-spacing:.04em;background:none;border:1px solid var(--hair-2);color:var(--dim);padding:9px 16px;cursor:pointer}
.btn:hover{color:var(--text);border-color:var(--text)}
.btn.primary{background:#F3C544;border-color:#F3C544;color:var(--ink);font-weight:600}
.addbtn{font-family:var(--sans);font-size:13px;letter-spacing:.04em;background:none;border:1px dashed var(--hair-2);color:var(--dim);padding:10px 16px;cursor:pointer;margin:14px 0 0}
.addbtn:hover{color:var(--text);border-color:var(--text)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.field label{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.1em;color:var(--faint);margin-bottom:5px}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--sans);font-size:12.5px;color:var(--faint);margin-top:14px}
.inline input[type=file]{width:auto;font-size:12px}
.inline label{display:flex;gap:7px;align-items:center;cursor:pointer}
.inline label input[type=checkbox]{width:16px;height:16px;accent-color:#F3C544}

.channels{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--hair)}
.channel{display:flex;align-items:center;gap:16px;padding:19px 4px;border-bottom:1px solid var(--hair);text-decoration:none}
.channel:nth-child(odd){border-right:1px solid var(--hair);padding-right:22px}
.channel:nth-child(even){padding-left:22px}
.channel svg{width:22px;height:22px;flex:0 0 22px;fill:var(--dim);transition:fill .2s}
.channel .names{flex:1 1 auto;min-width:0}
.channel .plat{font-size:22px;display:block;line-height:1.25}
.channel .handle{font-family:var(--sans);font-size:12.5px;color:var(--faint);display:block;word-break:break-all}
.channel .go{font-family:var(--sans);font-size:11.5px;letter-spacing:.1em;color:var(--faint)}
.channel:hover svg{fill:#F3C544}
.channel:hover .plat{color:#F3C544}
.channel.off{cursor:default}
.channel.off:hover svg{fill:var(--dim)}
.channel.off:hover .plat{color:var(--text)}

footer{border-top:1px solid var(--hair);padding:38px 0 54px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-end}
footer p{margin:0;max-width:40ch;color:var(--dim);font-size:16.5px}
footer .sig{font-family:var(--sans);font-size:11.5px;letter-spacing:.1em;color:var(--faint)}

@media (max-width:860px){
  .prow{grid-template-columns:26px 1fr;gap:4px 14px;padding:14px 0}
  .prow .role{grid-column:2}
  .prow .pseudo{grid-column:2}
  .prow .heroes{grid-column:2}
  .erow.player{grid-template-columns:1fr 1fr}
  .erow.player .wide{grid-column:1 / -1}
  .erow.team{grid-template-columns:1fr 54px 34px 34px 34px}
  .erow.team .wide{grid-column:1 / -1}
  .channels{grid-template-columns:1fr}
  .channel:nth-child(odd){border-right:0;padding-right:4px}
  .channel:nth-child(even){padding-left:4px}
}
@media (max-width:560px){
  body{font-size:17px}.page{padding:0 20px}
  .crest{height:128px}
  .crest img{height:128px}
  .crest.empty{width:128px;height:128px}
  .theader{gap:20px;padding:30px 0 24px}
  .section{padding:46px 0}
  .erow.link,.erow.staff{grid-template-columns:1fr 34px}
  .erow.link .wide,.erow.staff .wide{grid-column:1 / -1}
}
@media (prefers-reduced-motion:reduce){
  html:focus-within{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
}
</style>
</head>

<script>
/* =======================================================================
   ARCANAE — site statique.
   Tout le contenu (équipes, couleurs, joueurs, liens, staff) vit dans
   data.json. Ce fichier-ci ne contient que la mise en forme.
   Pour modifier : ouvrir le site avec ?admin au bout de l'URL.
   ======================================================================= */
(function(){
"use strict";

var ROLES = ["Tank","Hitscan","Flex DPS","Main Support","Flex Support","Remplaçant","En essai","Coach","Manager"];
var PLATFORMS = ["tiktok","instagram","twitch","discord","youtube","x","site"];
var LSKEY = "arcanae-brouillon";
var PALETTE = ["#9B6BF0","#E85252","#F3C544","#CFE6FF","#5BD6A8","#F08BC8","#7FB4F5"];

var FALLBACK = {org:{tagline:"",heroesDir:"heroes/",staff:[],links:[]}, teams:[]};
try{
  var seedEl = document.getElementById("seed");
  if(seedEl) FALLBACK = JSON.parse(seedEl.textContent);
}catch(e){}
var state = clone(FALLBACK), published = clone(FALLBACK);
var isAdmin = /[?&]admin\b/.test(location.search);
var editing = false, hasDraft = false, armed = null;

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function el(id){ return document.getElementById(id); }
function tint(hex){
  var m = /^#?([0-9a-fA-F]{6})$/.exec(String(hex||"").trim());
  if(!m) return "#EDEFF6";
  var n = parseInt(m[1],16), r=(n>>16)&255, g=(n>>8)&255, b=n&255, k=0.90;
  return "rgb("+Math.round(r+(255-r)*k)+","+Math.round(g+(255-g)*k)+","+Math.round(b+(255-b)*k)+")";
}
var SOCIALS = ["twitch","discord","instagram","tiktok","x","youtube"];
var SOCIAL_LABEL = {twitch:"Twitch",discord:"Discord",instagram:"Instagram",tiktok:"TikTok",x:"X",youtube:"YouTube"};
var STAFF_ROLES = ["Coach","Manager"];
function isStaff(p){ return STAFF_ROLES.indexOf(p.role) >= 0; }
function heroSrc(v){
  v = String(v||"").trim();
  if(!v) return "";
  if(/^(https?:|data:)/i.test(v) || v.indexOf("/") >= 0) return v;
  if(!/\.(png|jpe?g|webp|svg|gif)$/i.test(v)) v += ".png";
  return (state.org.heroesDir||"") + v;
}
function crestBg(t){ return t.crestBg || ""; }
function crestCls(t){ return t.crestBg ? " light" : ""; }
function crestSty(t){ var b = crestBg(t); return b ? ' style="background:'+b+'"' : ''; }
function slug(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || ("equipe-"+uid());
}

function normalise(d){
  var out = {org:{tagline:"",staff:[],links:[]}, teams:[]};
  if(!d || typeof d !== "object") return out;
  var o = d.org || {};
  out.org.tagline = o.tagline || "";
  out.org.heroesDir = (o.heroesDir === undefined) ? "heroes/" : (o.heroesDir || "");
  out.org.staff = (Array.isArray(o.staff)?o.staff:[]).map(function(s){
    return {id:s.id||uid(), name:s.name||"", title:s.title||""}; });
  out.org.links = (Array.isArray(o.links)?o.links:[]).map(function(l){
    return {id:l.id||uid(), platform:l.platform||"site", label:l.label||"", url:l.url||""}; });
  out.teams = (Array.isArray(d.teams)?d.teams:[]).map(function(t){
    return {
      id: t.id || slug(t.name),
      name: t.name || "Équipe",
      color: t.color || "#9E96B4",
      colorLabel: t.colorLabel || "",
      logo: t.logo || "",
      lightCrest: t.lightCrest !== false,
      crestBg: t.crestBg || "",
      players: (Array.isArray(t.players)?t.players:[]).map(function(p){
        var L = (p.links && typeof p.links === "object") ? p.links : {};
        return {id:p.id||uid(), pseudo:p.pseudo||"", role:p.role||"Tank",
                heroes:p.heroes||"", main:p.main||"", captain:!!p.captain,
                links:{twitch:L.twitch||"", discord:L.discord||"", instagram:L.instagram||"",
                       tiktok:L.tiktok||"", x:L.x||"", youtube:L.youtube||""}};
      })
    };
  });
  return out;
}

function teamById(id){
  for(var i=0;i<state.teams.length;i++) if(state.teams[i].id === id) return state.teams[i];
  return null;
}
function teamIdx(id){
  for(var i=0;i<state.teams.length;i++) if(state.teams[i].id === id) return i;
  return -1;
}

/* ── brouillon ───────────────────────────────── */
function saveDraft(){
  hasDraft = true;
  try{ localStorage.setItem(LSKEY, JSON.stringify(state)); }catch(e){}
}
function dropDraft(){
  hasDraft = false;
  try{ localStorage.removeItem(LSKEY); }catch(e){}
  state = clone(published);
  render();
}
function downloadJSON(){
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "data.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

/* ── routage ─────────────────────────────────── */
function route(){
  var h = (location.hash||"").replace(/^#/,"");
  var i = h.indexOf("--");
  if(i > 0){
    var t0 = teamById(h.slice(0,i));
    var p0 = t0 && byId(t0.players, h.slice(i+2));
    if(p0) return {kind:"player", team:t0, player:p0};
  }
  var t1 = teamById(h);
  return t1 ? {kind:"team", team:t1} : {kind:"home"};
}
function current(){ var r = route(); return r.kind === "home" ? "accueil" : r.team.id; }
function href(k){ return location.pathname + location.search + "#" + k; }

function renderNav(){
  var here = current();
  var html = state.teams.map(function(t){
    return '<a href="'+href(t.id)+'"'+(here===t.id?' aria-current="page"':'')+
           '><i class="dot" style="color:'+esc(t.color)+'"></i>'+esc(t.name)+'</a>';
  }).join("");
  html += '<a href="'+href("accueil")+'"'+(here==="accueil"?' aria-current="page"':'')+'>Liens</a>';
  el("nav").innerHTML = html;
}

/* ── pictogrammes de rôle (dessins originaux) ── */
function roleGlyph(role){
  var r = String(role||"").toLowerCase(), d;
  if(r.indexOf("tank") >= 0){
    d = '<path d="M12 2.6 20 5.6v6.1c0 4.6-3.3 8-8 9.7-4.7-1.7-8-5.1-8-9.7V5.6Z"/>';
  }else if(r.indexOf("support") >= 0){
    d = '<path d="M12 4.2v15.6M4.2 12h15.6"/><circle cx="12" cy="12" r="9.2" opacity=".45"/>';
  }else if(r.indexOf("hitscan")>=0 || r.indexOf("dps")>=0 || r.indexOf("dégât")>=0 || r.indexOf("degat")>=0){
    d = '<circle cx="12" cy="12" r="6.4"/><path d="M12 1.6v4.2M12 18.2v4.2M1.6 12h4.2M18.2 12h4.2"/>';
  }else{
    d = '<circle cx="12" cy="12" r="5.6" opacity=".7"/>';
  }
  return '<span class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" '+
    'stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg></span>';
}

/* ── bandeau brouillon ───────────────────────── */
function draftHTML(){
  if(!editing) return "";
  if(!hasDraft) return '<div class="editbar">Tes changements restent sur cet appareil tant que tu n\'as pas publié le nouveau data.json.</div>';
  return '<div class="draft"><b>Brouillon local non publié.</b> Les visiteurs voient encore l\'ancienne version. '+
    'Télécharge data.json, puis redépose-le dans ton dépôt GitHub pour mettre le site à jour.'+
    '<span class="acts"><button class="btn primary" id="dl">Télécharger data.json</button>'+
    '<button class="btn" id="drop">Abandonner le brouillon</button></span></div>';
}

function channel(l){
  var icon = platformIcon(l.platform), name = esc(l.label || l.platform);
  if(l.url) return '<a class="channel" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+icon+
    '<span class="names"><span class="plat">'+name+'</span>'+
    '<span class="handle">'+esc(String(l.url).replace(/^https?:\/\//,""))+'</span></span>'+
    '<span class="go">Ouvrir</span></a>';
  return '<span class="channel off">'+icon+
    '<span class="names"><span class="plat">'+name+'</span><span class="handle">lien à renseigner</span></span>'+
    '<span class="go">—</span></span>';
}

/* ── page équipe ─────────────────────────────── */
function teamHTML(id){
  var t = teamById(id);
  if(!t) return '<section class="section"><h2>Équipe introuvable</h2>'+
                '<a class="back" href="'+href("accueil")+'">Retour à la Arcanae</a></section>';

  var crest = t.logo
    ? '<div class="crest'+crestCls(t)+'"'+crestSty(t)+'><img src="'+esc(t.logo)+'" alt="Logo '+esc(t.name)+'"></div>'
    : '<div class="crest empty">Logo<br>à venir</div>';

  var roster;
  if(editing){
    roster = '<div class="roster">'+ t.players.map(function(p){ return editRow(t,p); }).join("") +'</div>'+
      '<button class="addbtn" data-add="'+t.id+'">Ajouter un joueur</button>'+
      '<div class="esec"><h3>Réglages de l\'équipe</h3><div class="inline">'+
        '<label>Logo <input type="file" accept="image/*" data-logo="'+t.id+'"></label>'+
        (t.logo?'<button class="btn" data-dellogo="'+t.id+'">Retirer le logo</button>':'')+
        '<label><input type="checkbox" data-light="'+t.id+'"'+(t.lightCrest?" checked":"")+'> Fond clair derrière le logo</label>'+
        '<label>Teinte du cadre <input type="color" data-crestbg="'+t.id+'" value="'+esc(crestBg(t)||"#EDEFF6")+'"></label>'+
        (t.crestBg?'<button class="btn" data-clearbg="'+t.id+'">Teinte auto</button>':'')+
      '</div></div>';
  }else if(t.players.length === 0){
    roster = '<div class="roster"><p class="empty-note">Effectif à compléter.</p></div>';
  }else{
    var joueurs = t.players.filter(function(p){ return !isStaff(p); });
    var encadr  = t.players.filter(isStaff);
    roster = "";
    if(joueurs.length) roster += '<div class="roster">'+ joueurs.map(function(p){ return playerRow(t,p); }).join("") +'</div>';
    else roster += '<div class="roster"><p class="empty-note">Effectif à compléter.</p></div>';
    if(encadr.length) roster += '<p class="block-title">Encadrement</p><div class="roster">'+
      encadr.map(function(p){ return playerRow(t,p); }).join("") +'</div>';
  }

  return draftHTML()+
  '<section class="theader" style="--accent:'+esc(t.color)+'">'+crest+
    '<div class="naming"><p class="genus">Arcana</p>'+
    '<p class="species">'+esc(t.name.toLowerCase())+'</p>'+
    '<p class="swatch"><i></i>'+esc(t.color)+(t.colorLabel?" — "+esc(t.colorLabel):"")+'</p></div></section>'+
  '<section style="--accent:'+esc(t.color)+'">'+roster+
    '<a class="back" href="'+href("accueil")+'">Retour à la Arcanae</a></section>'+
  '<footer><p>Les héros indiqués sont les picks principaux de chaque joueur.</p>'+
  '<span class="sig">Arcana '+esc(t.name.toLowerCase())+'</span></footer>';
}

function playerRow(t,p){
  var hs = (p.heroes||"").split(",").map(function(s){return s.trim();}).filter(Boolean);
  return '<a class="prow" href="'+href(t.id+"--"+p.id)+'">'+ roleGlyph(p.role)+
    '<span class="role">'+esc(p.role||"")+'</span>'+
    '<span class="pseudo">'+esc(p.pseudo||"—")+
      (p.captain?'<span class="cap">capitaine</span>':"")+'</span>'+
    '<span class="heroes">'+(hs.length?esc(hs.join(", ")):'<em>héros à renseigner</em>')+'</span></a>';
}

/* ── page joueur ─────────────────────────────── */
function playerHTML(t,p){
  var hs = (p.heroes||"").split(",").map(function(s){return s.trim();}).filter(Boolean);
  var src = heroSrc(p.main);
  var visuel = src
    ? '<div class="pmain"><img src="'+esc(src)+'" alt="'+esc(p.main)+'"></div>'
    : (editing ? '<div class="pmain"><div class="none">Personnage à renseigner<br>dans le champ ci-contre</div></div>' : '');

  var liens = SOCIALS.filter(function(k){ return p.links[k]; }).map(function(k){
    return '<a href="'+esc(p.links[k])+'" target="_blank" rel="noopener">'+
           platformIcon(k)+SOCIAL_LABEL[k]+'</a>';
  }).join("");

  var ed = "";
  if(editing){
    ed = '<div class="esec"><h3>Fiche de '+esc(p.pseudo||"ce joueur")+'</h3><div class="fields">'+
      '<div class="field"><label>Pseudo</label><input data-f="pseudo" data-id="'+p.id+'" type="text" value="'+esc(p.pseudo)+'"></div>'+
      '<div class="field"><label>Personnage principal (nom du png)</label><input data-f="main" data-id="'+p.id+'" list="heroes-ow" type="text" value="'+esc(p.main)+'" placeholder="tracer"></div>'+
      '<div class="field"><label>Héros joués</label><input data-f="heroes" data-id="'+p.id+'" list="heroes-ow" type="text" value="'+esc(p.heroes)+'" placeholder="Séparés par des virgules"></div>'+
      SOCIALS.map(function(k){
        return '<div class="field"><label>'+SOCIAL_LABEL[k]+'</label><input data-soc="'+k+'" data-id="'+p.id+'" type="text" value="'+esc(p.links[k])+'" placeholder="https://…"></div>';
      }).join("")+
    '</div></div>';
  }

  return draftHTML()+
  '<section class="pcard" style="--accent:'+esc(t.color)+'">'+visuel+
    '<div class="pinfo">'+
      '<p class="prole">'+roleGlyph(p.role)+esc(p.role||"")+
        (p.captain?' — capitaine':'')+'</p>'+
      '<h2>'+esc(p.pseudo||"—")+'</h2>'+
      '<p class="plist">'+(hs.length?esc(hs.join(", ")):'<em>héros à renseigner</em>')+'</p>'+
      (liens?'<div class="psoc">'+liens+'</div>':'')+
    '</div>'+
  '</section>'+
  '<section style="--accent:'+esc(t.color)+'">'+ed+
    '<a class="back" href="'+href(t.id)+'">Retour à Arcana '+esc(t.name.toLowerCase())+'</a></section>'+
  '<footer><p>Membre de l\'équipe Arcana '+esc(t.name.toLowerCase())+'.</p>'+
  '<span class="sig">Arcanae — Overwatch</span></footer>';
}

function editRow(t,p){
  var roleOpts = ROLES.map(function(r){
    return '<option value="'+r+'"'+(p.role===r?" selected":"")+'>'+r+'</option>'; }).join("");
  var teamOpts = state.teams.map(function(x){
    return '<option value="'+x.id+'"'+(x.id===t.id?" selected":"")+'>'+esc(x.name)+'</option>'; }).join("");
  return '<div class="erow player">'+
    '<select data-f="role" data-id="'+p.id+'">'+roleOpts+'</select>'+
    '<input data-f="pseudo" data-id="'+p.id+'" type="text" value="'+esc(p.pseudo)+'" placeholder="Pseudo">'+
    '<span class="chk" title="Capitaine"><input type="checkbox" data-f="captain" data-id="'+p.id+'"'+(p.captain?" checked":"")+'></span>'+
    '<input class="wide" data-f="heroes" data-id="'+p.id+'" list="heroes-ow" type="text" value="'+esc(p.heroes)+'" placeholder="Héros, séparés par des virgules">'+
    '<select data-f="move" data-id="'+p.id+'">'+teamOpts+'</select>'+
    '<button class="iconbtn" data-del="'+p.id+'" title="Supprimer">✕</button></div>';
}

/* ── rendu ───────────────────────────────────── */
function render(){
  var r = route();
  renderNav();
  el("view").innerHTML = r.kind === "home"   ? homeHTML()
                       : r.kind === "player" ? playerHTML(r.team, r.player)
                       :                       teamHTML(r.team.id);
  armed = null;
  wire(current());
}

function wire(here){
  var view = el("view");
  var dl = el("dl"); if(dl) dl.addEventListener("click", downloadJSON);
  var dp = el("drop"); if(dp) dp.addEventListener("click", dropDraft);

  view.addEventListener("input", function(e){
    var t = e.target, id = t.getAttribute("data-id");
    if(t.id === "tagline"){ state.org.tagline = t.value; saveDraft(); return; }
    var k;
    if((k = t.getAttribute("data-s"))){ var s = byId(state.org.staff,id); if(s){ s[k]=t.value; saveDraft(); } return; }
    if((k = t.getAttribute("data-l"))){ var l = byId(state.org.links,id); if(l && k!=="platform"){ l[k]=t.value; saveDraft(); } return; }
    if((k = t.getAttribute("data-t"))){ var tm = teamById(id); if(tm){ tm[k]=t.value; saveDraft();
        if(k==="color"||k==="name") render(); } return; }
    var sk = t.getAttribute("data-soc");
    if(sk && here!=="accueil"){
      var ts = teamById(here), ps = ts && byId(ts.players,id);
      if(ps){ ps.links[sk] = t.value; saveDraft(); }
      return;
    }
    var f = t.getAttribute("data-f");
    if(f && f!=="move" && f!=="captain" && here!=="accueil"){
      var tt = teamById(here), p = tt && byId(tt.players,id);
      if(p){ p[f] = t.value; saveDraft(); }
    }
  });

  view.addEventListener("change", function(e){
    var t = e.target, id = t.getAttribute("data-id");
    var k = t.getAttribute("data-l");
    if(k === "platform"){ var l = byId(state.org.links,id); if(l){ l.platform=t.value; saveDraft(); render(); } return; }
    var f = t.getAttribute("data-f");
    if(f === "move" && here!=="accueil"){ movePlayer(here, id, t.value); return; }
    if(f === "role" && here!=="accueil"){
      var p = byId(teamById(here).players, id); if(p){ p.role=t.value; saveDraft(); } return; }
    if(f === "captain" && here!=="accueil"){
      var pc = byId(teamById(here).players, id); if(pc){ pc.captain=t.checked; saveDraft(); } return; }
    var lk = t.getAttribute("data-logo");
    if(lk && t.files && t.files[0]){ readLogo(lk, t.files[0]); return; }
    var li = t.getAttribute("data-light");
    if(li){ var tm = teamById(li); if(tm){ tm.lightCrest = t.checked; saveDraft(); render(); } return; }
    var cb = t.getAttribute("data-crestbg");
    if(cb){ var tc = teamById(cb); if(tc){ tc.crestBg = t.value; saveDraft(); render(); } }
  });

  view.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("button") : null;
    if(!b || b.disabled) return;
    var v;

    if((v = b.getAttribute("data-add"))){
      teamById(v).players.push({id:uid(), pseudo:"", role:"Tank", heroes:"", main:"", captain:false,
        links:{twitch:"",discord:"",instagram:"",tiktok:"",x:"",youtube:""}});
      saveDraft(); render(); return;
    }
    if((v = b.getAttribute("data-addstaff"))){
      state.org.staff.push({id:uid(), name:"", title:""}); saveDraft(); render(); return;
    }
    if((v = b.getAttribute("data-addlink"))){
      state.org.links.push({id:uid(), platform:"site", label:"", url:""}); saveDraft(); render(); return;
    }
    if((v = b.getAttribute("data-addteam"))){
      var n = state.teams.length;
      state.teams.push({id:"equipe-"+uid(), name:"Nouvelle équipe",
        color:PALETTE[n % PALETTE.length], colorLabel:"", logo:"", lightCrest:true, players:[]});
      saveDraft(); render(); return;
    }
    if((v = b.getAttribute("data-up")) || (v = b.getAttribute("data-down"))){
      var dir = b.hasAttribute("data-up") ? -1 : 1, i = teamIdx(v), j = i + dir;
      if(i>=0 && j>=0 && j<state.teams.length){
        var tmp = state.teams[i]; state.teams[i] = state.teams[j]; state.teams[j] = tmp;
        saveDraft(); render();
      }
      return;
    }
    if((v = b.getAttribute("data-dellogo"))){
      teamById(v).logo = ""; saveDraft(); render(); return;
    }
    if((v = b.getAttribute("data-clearbg"))){
      teamById(v).crestBg = ""; saveDraft(); render(); return;
    }

    /* suppressions : deux clics */
    var kinds = [["data-del","player"],["data-delstaff","staff"],["data-dellink","link"],["data-delteam","team"]];
    for(var i2=0;i2<kinds.length;i2++){
      var attr = kinds[i2][0], kind = kinds[i2][1], val = b.getAttribute(attr);
      if(!val) continue;
      var token = kind+":"+val;
      if(armed !== token){
        if(armed){
          var prev = view.querySelector('[data-del],[data-delstaff],[data-dellink],[data-delteam]');
          view.querySelectorAll(".iconbtn.armed").forEach(function(x){ x.classList.remove("armed"); x.textContent="✕"; });
        }
        armed = token; b.classList.add("armed"); b.textContent = "OK";
        return;
      }
      armed = null;
      if(kind === "player"){
        var tt = teamById(here);
        tt.players = tt.players.filter(function(p){ return p.id !== val; });
      }else if(kind === "staff"){
        state.org.staff = state.org.staff.filter(function(s){ return s.id !== val; });
      }else if(kind === "link"){
        state.org.links = state.org.links.filter(function(l){ return l.id !== val; });
      }else if(kind === "team"){
        state.teams = state.teams.filter(function(x){ return x.id !== val; });
        if(here === val){ location.hash = "accueil"; }
      }
      saveDraft(); render(); return;
    }
  });
}

function byId(list,id){
  for(var i=0;i<list.length;i++) if(list[i].id === id) return list[i];
  return null;
}
function movePlayer(from, id, to){
  if(from === to) return;
  var a = teamById(from), b = teamById(to);
  if(!a || !b) return;
  var p = byId(a.players, id); if(!p) return;
  a.players = a.players.filter(function(x){ return x.id !== id; });
  b.players.push(p);
  saveDraft(); render();
}
function readLogo(id, file){
  var r = new FileReader();
  r.onload = function(){ var t = teamById(id); if(t){ t.logo = r.result; saveDraft(); render(); } };
  r.readAsDataURL(file);
}

/* ── démarrage ───────────────────────────────── */
window.addEventListener("hashchange", render);

if(isAdmin){
  el("editbtn").hidden = false;
  el("editbtn").addEventListener("click", function(){
    editing = !editing;
    this.classList.toggle("on", editing);
    this.textContent = editing ? "Terminer" : "Mode édition";
    render();
  });
}

function boot(data){
  published = normalise(data);
  var draft = null;
  if(isAdmin){
    try{ var raw = localStorage.getItem(LSKEY); if(raw) draft = normalise(JSON.parse(raw)); }catch(e){}
  }
  if(draft && draft.teams.length){ state = draft; hasDraft = true; }
  else { state = clone(published); }
  render();
}

render();
fetch("data.json", {cache:"no-store"})
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(d){ boot(d && d.teams && d.teams.length ? d : FALLBACK); })
  .catch(function(){ boot(FALLBACK); });
})();
</script>
